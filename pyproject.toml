[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bullpen"
version = "0.1.0"
description = "When should a manager deploy the best available reliever? Game-state models and simulation on Retrosheet play-by-play."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sonia Gupta" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = ["jupyter>=1.0", "nbconvert>=7", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
